services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aftershock
      POSTGRES_USER: aftershock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftershock -d aftershock"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aftershock:${POSTGRES_PASSWORD}@db:5432/aftershock
      DATA_DIR: /data
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API: http://mailpit:8025
      WEB_URL: http://localhost:${WEB_PORT:-3400}
    ports:
      - "127.0.0.1:${API_PORT:-8380}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 接本機模型（例如 Ollama）時需要
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3400}:3000"
    depends_on:
      api:
        condition: service_healthy

  # 假信箱：所有寄出的信都進這裡，不會到達任何真實信箱。網頁介面 http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8026}:8025"
      - "127.0.0.1:${MAIL_SMTP_PORT:-1026}:1025"

volumes:
  pgdata:
