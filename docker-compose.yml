services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aftershock
      POSTGRES_USER: aftershock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftershock -d aftershock"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
